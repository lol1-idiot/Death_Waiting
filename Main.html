<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEATH WAITING</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: #0d0d12;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    transition: background 0.5s;
  }
  body.creepy { background: #000; }
  body.stress-high #game { animation: subtleShake 3s infinite; }
  @keyframes subtleShake {
    0%, 100% { transform: translate(0,0); }
    25% { transform: translate(1px,-1px); }
    50% { transform: translate(-1px,1px); }
    75% { transform: translate(1px,1px); }
  }
  #game {
    max-width: 820px;
    width: 100%;
    background: linear-gradient(145deg, #16161f, #0f0f16);
    border: 1px solid #2a2a3a;
    border-radius: 14px;
    padding: 20px 24px 24px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    position: relative;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #7a7a9a;
    margin-bottom: 14px;
    border-bottom: 1px solid #222233;
    padding-bottom: 10px;
  }
  #hud .day { color: #c9a86a; font-weight: bold; }
  #stressBar {
    width: 120px; height: 8px;
    background: #222;
    border-radius: 4px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
    margin-left: 6px;
  }
  #stressFill {
    height: 100%; width: 0%;
    background: #4a8a4a;
    transition: width 0.4s, background 0.4s;
  }
  #stressLabel { color: #a05050; }

  /* GAMBAR FULL — kotak, bukan bulat */
  #scene {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    border: 1px solid #2a2a3a;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #1a1a28, #12121a);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font-size: 13px;
    letter-spacing: 1px;
    transition: opacity 0.4s ease;
    overflow: hidden;
    position: relative;
  }
  #scene.fade-img { opacity: 0; }
  #scene .placeholder {
    text-align: center;
    line-height: 1.6;
  }
  #scene .placeholder small {
    display: block;
    color: #333;
    font-size: 10px;
    margin-top: 4px;
    letter-spacing: 2px;
  }

  #speaker {
    text-align: center; color: #8a8ab0;
    font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 10px;
  }
  #text {
    font-size: 17px; line-height: 1.7;
    min-height: 120px; margin-bottom: 22px;
    text-align: justify;
  }
  .stress-note {
    display: block;
    margin-top: 14px;
    padding: 10px 14px;
    border-left: 3px solid #6a3030;
    background: rgba(80,20,20,0.15);
    color: #b08080;
    font-style: italic;
    font-size: 15px;
    border-radius: 4px;
  }
  #choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    background: #1c1c2a; border: 1px solid #33334a;
    color: #d0d0e0; padding: 13px 18px;
    border-radius: 8px; cursor: pointer;
    font-size: 15px; font-family: inherit;
    text-align: left; transition: all 0.2s;
  }
  .choice:hover {
    background: #2a2a40; border-color: #5a5a8a;
    transform: translateX(4px);
  }
  .choice.desperate {
    border-color: #5a2020;
    color: #b08080;
  }
  .choice.desperate:hover {
    background: #2a1818;
    border-color: #8a3030;
  }
  #controls {
    margin-top: 16px; text-align: center;
    font-size: 11px; color: #444;
  }
  #controls button {
    background: none; border: 1px solid #333;
    color: #777; padding: 5px 10px;
    border-radius: 6px; cursor: pointer;
    margin: 0 3px; font-family: inherit; font-size: 11px;
  }
  #controls button:hover { color: #aaa; border-color: #666; }
  .fade { animation: fadeIn 0.5s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .ending-title { color: #c9a86a; text-align: center; font-size: 20px; margin-bottom: 14px; letter-spacing: 3px; }

  #overlay {
    position: fixed; inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    cursor: none;
  }
  #overlay.active { display: flex; }
  #why {
    color: #6a0000;
    font-size: 120px;
    font-weight: bold;
    letter-spacing: 10px;
    font-family: 'Courier New', monospace;
    animation: shake 0.15s infinite;
    user-select: none;
  }
  @keyframes shake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-6px, 4px); }
    50% { transform: translate(5px, -5px); }
    75% { transform: translate(-4px, -3px); }
    100% { transform: translate(6px, 5px); }
  }

  @media (max-width: 600px) {
    #game { padding: 14px 16px 18px; }
    #text { font-size: 15px; }
    #scene { aspect-ratio: 4 / 3; }
  }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <span>Hari: <span class="day" id="dayLabel">1</span> / 14</span>
    <span class="stress">Beban: <span id="stressLabel">0</span>
      <span id="stressBar"><span id="stressFill"></span></span>
    </span>
  </div>

  <!-- GAMBAR FULL -->
  <div id="scene">
    <div class="placeholder">Gambar Adegan<br><small>img/...</small></div>
  </div>

  <div id="speaker">NARASI</div>
  <div id="text"></div>
  <div id="choices"></div>
  <div id="controls">
    <button onclick="resetGame()">↻ Mulai Ulang</button>
  </div>
</div>

<div id="overlay"><div id="why">WHY??</div></div>

<script>
// ============================================================
// STATE GLOBAL
// ============================================================
const state = {
  day: 1,
  stress: 0,
  trustElara: 0,
  evidence: 0,
  current: "start",
  salahCctv: false
};

// ============================================================
// CERITA — dengan portrait per node
// ============================================================
const story = {

  // ===================== DAY 1 =====================
  start: {
    day: 1, speaker: "NARASI",
    portrait: "img/01_kantor_luar.jpg",
    text: "Kota Virendell. Hujan turun sejak kereta terakhirmu tiba. Kau tidak ingat kenapa kau menerima surat amplop hitam itu — hanya satu kalimat: \"Kami butuh seseorang yang tidak punya apa-apa untuk kehilangan.\" Kini kau berdiri di depan kantor polisi dengan lencana pinjaman dan nama yang bahkan bukan namamu.\n\nSeorang perwira keluar menyambutmu. \"Kapten Harrow. Kau detective baru?\" Ia menyerahkan berkas tebal. \"Tiga mayat dalam dua minggu. Semua dengan lingkaran arang di dahi dan koin kuno di tangan. Aku butuh orang luar. Seseorang yang tidak punya kepentingan di kota ini.\"",
    choices: [
      { label: "Terima kasusnya. Selidiki.", next: "day1_terima" },
      { label: "Tolak. Ini bukan urusanku.", next: "ending1_start" }
    ]
  },

  day1_terima: {
    day: 1, speaker: "SERGEANT ELARA VOSS",
    portrait: "img/02_elara_kenalan.jpg",
    text: "Seorang wanita berusia tiga puluhan masuk, senyum ramah, jabatan tangan mantap. \"Elara Voss. Aku menangani kasus ini sejak mayat pertama. Senang akhirnya ada yang membantu.\" Ia menatapmu lama. \"Kau terlihat... familiar. Pernah ke kota ini sebelumnya?\"",
    choices: [
      { label: "\"Tidak pernah. Ini pertama kaliku.\"", next: "day1_lanjut", effects: { trustElara: 1 } },
      { label: "\"Kenapa kau bertanya?\"", next: "day1_curiga", effects: { trustElara: -1, evidence: 1 } }
    ]
  },

  day1_curiga: {
    day: 1, speaker: "SERGEANT ELARA VOSS",
    portrait: "img/03_elara_senyum_tipis.jpg",
    text: "Elara tersenyum tipis. \"Hanya basa-basi. Di kota kecil, wajah baru selalu menarik perhatian.\" Ia berbalik. \"Ayo. Aku tunjukkan TKP pertama. Kita punya banyak waktu untuk saling mengenal.\"",
    choices: [{ label: "Ikuti Elara.", next: "day2_tkp" }]
  },

  day1_lanjut: {
    day: 1, speaker: "SERGEANT ELARA VOSS",
    portrait: "img/04_elara_peta.jpg",
    text: "Elara membuka peta kota. \"TKP pertama di gudang pelabuhan. Kedua di gereja tua. Ketiga... di kantor polisi ini. Di ruang arsip. Dua malam lalu.\" Ia menatapmu. \"Pelaku berani masuk ke sarang kami. Itu artinya orang dalam, atau orang yang sangat tahu gedung ini.\"",
    choices: [{ label: "Pergi ke TKP pertama.", next: "day2_tkp" }]
  },

  // ===================== ENDING 1 =====================
  ending1_start: {
    day: 1, speaker: "NARASI",
    portrait: "img/e1_kamar_gelap.jpg",
    text: "Kau mengembalikan berkas itu. \"Aku tidak bisa.\" Kapten Harrow menatapmu kecewa, tapi tidak memaksa. Kau meninggalkan kota keesokan harinya.\n\nNamun kabar itu mengikutimu. Korban keempat. Kelima. Keenam. Setiap malam kau menonton berita, dan setiap malam jumlahnya bertambah. Kau bisa saja mencegahnya. Kau bisa saja menyelamatkan mereka. Tapi kau memilih pergi.\n\nSetahun kemudian, di sebuah kamar sewaan yang gelap, kau menatap cermin. Wajahmu sudah tidak kau kenali. Di tanganmu, sebilah pisau. Dan di dinding, tulisan arang: \"KAU YANG MEMBUATKU.\"",
    onEnter: () => { state.stress = 10; },
    choices: [{ label: "Akhiri semuanya.", next: "ending1_final" }]
  },
  ending1_final: {
    day: 1, ending: "ENDING 1 — KETIDAKPEDULIAN",
    portrait: "img/e1_kamar_gelap.jpg",
    text: "Kau mengakhiri hidupmu di kamar itu. Koran esok hari menulis: \"Mantan Detektif Ditemukan Tewas.\" Tidak ada yang tahu bahwa kau adalah orang yang seharusnya menyelamatkan Virendell. Tidak ada yang tahu bahwa kau membawa enam nyawa di pundakmu.\n\n— TAMAT —",
    choices: []
  },

  // ===================== DAY 2 =====================
  day2_tkp: {
    day: 2, speaker: "NARASI",
    portrait: "img/05_gudang_pelabuhan.jpg",
    text: "Gudang pelabuhan. Bau garam dan kayu lapuk. Di lantai, lingkaran arang masih samar. Elara berdiri di sampingmu. \"Korban pertama, Pak Renner. Pedagang kain. Tidak punya musuh. Tapi...\" Ia berhenti. \"Ia punya catatan utang dengan seseorang di kantor polisi. Aku sudah mengeceknya. Tidak ada hubungan, kataku pada Kapten.\"",
    choices: [
      { label: "\"Siapa yang berutang padanya?\"", next: "day2_utang", effects: { evidence: 1 } },
      { label: "Periksa lingkaran arang lebih dekat.", next: "day2_arang", effects: { evidence: 1 } },
      { label: "Percaya saja pada Elara, lanjut ke TKP berikutnya.", next: "day3_gereja", effects: { trustElara: 1 } }
    ]
  },

  day2_utang: {
    day: 2, speaker: "SERGEANT ELARA VOSS",
    portrait: "img/06_elara_tegang.jpg",
    text: "Elara terdiam. \"Aku.\" Ia mengangkat tangan. \"Tapi itu utang lama, sudah lunas. Dan aku tidak membunuh siapa pun.\" Ia tersenyum. \"Kau boleh curiga. Tapi ingat — aku satu-satunya yang mau membantumu.\"",
    choices: [
      { label: "Percaya padanya... untuk sekarang.", next: "day3_gereja", effects: { trustElara: 2 } },
      { label: "Catat dalam hati. Jangan lupakan ini.", next: "day3_gereja", effects: { trustElara: -1, evidence: 1 } }
    ]
  },

  day2_arang: {
    day: 2, speaker: "NARASI",
    portrait: "img/07_arang_closeup.jpg",
    text: "Kau berjongkok. Arang itu bukan sembarang arang — ada pola di dalamnya. Segel perkumpulan rahasia yang bubar sepuluh tahun lalu. Perkumpulan yang, menurut arsip kota, didirikan oleh para pendiri kantor polisi Virendell.",
    choices: [
      { label: "Tunjukkan pada Elara.", next: "day2_tunjukkan" },
      { label: "Simpan informasi ini sendiri.", next: "day3_gereja", effects: { evidence: 1, trustElara: -1 } }
    ]
  },

  day2_tunjukkan: {
    day: 2, speaker: "SERGEANT ELARA VOSS",
    portrait: "img/08_elara_wajah_berubah.jpg",
    text: "Elara memeriksa pola itu lama. Wajahnya berubah. \"Ini... aku pernah lihat ini. Di rumah Kapten Harrow. Di atas perapiannya.\" Ia menatapmu. \"Kita tidak bisa langsung menuduhnya. Tapi kita harus menyelidikinya.\"",
    choices: [{ label: "Baik. Kita selidiki Kapten.", next: "day3_gereja", effects: { evidence: 1, trustElara: 1 } }]
  },

  // ===================== DAY 3 =====================
  day3_gereja: {
    day: 3, speaker: "NARASI",
    portrait: "img/09_gereja_tua.jpg",
    text: "Gereja tua di pinggir kota. Korban kedua, Pendeta Aldous, ditemukan di altar. Elara berdiri di ambang pintu. \"Aku tidak masuk ke sini sejak mayat itu ditemukan. Tempat ini... membuatku tidak nyaman.\"",
    choices: [
      { label: "\"Kenapa? Kau kenal pendeta itu?\"", next: "day3_kenal", effects: { evidence: 1 } },
      { label: "Masuk sendiri dan periksa altar.", next: "day3_altar" },
      { label: "Cari petunjuk lain di sekitar gereja.", next: "day3_petunjuk", effects: { evidence: 1 } }
    ]
  },

  day3_kenal: {
    day: 3, speaker: "SERGEANT ELARA VOSS",
    portrait: "img/10_elara_getir.jpg",
    text: "Elara mengangguk pelan. \"Ia... pernah menolongku. Dulu. Sebelum aku jadi polisi. Ia bilang aku punya masa depan. Ia salah.\" Ia tersenyum getir. \"Tapi aku tidak membunuhnya. Kalau kau berpikir begitu.\"",
    choices: [{ label: "Masuk ke gereja.", next: "day3_altar" }]
  },

  day3_altar: {
    day: 3, speaker: "NARASI",
    portrait: "img/11_buku_altar.jpg",
    text: "Di bawah altar, kau menemukan buku catatan. Halaman-halamannya berisi nama-nama. Tiga nama korban. Dan satu nama lagi yang belum dicoret — namamu. Di samping namamu: \"Ia tidak ingat. Bagus. Biarkan ia menyelidiki. Ia akan menemukan kebenaran pada waktunya.\"",
    choices: [
      { label: "Tunjukkan buku pada Elara.", next: "day3_tunjukkan", effects: { trustElara: 1 } },
      { label: "Simpan buku itu. Jangan percaya siapa pun.", next: "day3_simpan", effects: { trustElara: -2, evidence: 1 } }
    ]
  },

  day3_petunjuk: {
    day: 3, speaker: "NARASI",
    portrait: "img/12_kertas_lusuh.jpg",
    text: "Di bangku belakang gereja, kau menemukan secarik kertas lusuh. Sebuah jadwal pertemuan rahasia — tiga nama, satu tanggal, sepuluh tahun lalu. Salah satu nama itu: E. VOSS.",
    choices: [
      { label: "Tanya Elara langsung.", next: "day3_tanya_voss", effects: { trustElara: -1, evidence: 1 } },
      { label: "Simpan dan selidiki sendiri.", next: "day4_arsip", effects: { evidence: 1 } }
    ]
  },

  day3_tanya_voss: {
    day: 3, speaker: "SERGEANT ELARA VOSS",
    portrait: "img/13_elara_marah.jpg",
    text: "Elara menatap kertas itu. Wajahnya mengeras. \"Itu... pertemuan lama. Sebelum aku jadi polisi. Aku tidak ingin membicarakannya.\" Ia berbalik. \"Kita lanjut saja.\"",
    choices: [{ label: "Lanjut ke kantor.", next: "day4_arsip" }]
  },

  day3_tunjukkan: {
    day: 3, speaker: "SERGEANT ELARA VOSS",
    portrait: "img/14_elara_pucat.jpg",
    text: "Elara membaca buku itu dengan wajah pucat. \"Ini tulisan tangan...\" Ia berhenti. \"Aku tidak bisa memastikan. Tapi ini bukan tulisan Kapten.\" Ia menatapmu. \"Kau harus hati-hati. Seseorang di kantor tahu kau akan datang.\"",
    choices: [{ label: "Kembali ke kantor. Cari tahu masa lalu kota.", next: "day4_arsip", effects: { evidence: 1 } }]
  },

  day3_simpan: {
    day: 3, speaker: "NARASI",
    portrait: "img/15_tangan_jaket.jpg",
    text: "Kau menyelipkan buku itu ke jaketmu. Elara menatapmu. \"Kau menemukan sesuatu?\" — \"Tidak.\" Matanya mengikuti gerak tanganmu. Kau tidak yakin ia percaya.",
    choices: [{ label: "Kembali ke kantor.", next: "day4_arsip" }]
  },

  // ===================== DAY 4 =====================
  day4_arsip: {
    day: 4, speaker: "NARASI",
    portrait: "img/16_ruang_arsip.jpg",
    text: "Ruang arsip kantor polisi. Kau menyelinap masuk malam-malam. Debu, kertas lapuk, rak besi. Kau menemukan berkas lama: kasus tahun 2014. Kebakaran di gedung ini. Tiga anak hilang. Dua ditemukan tewas. Satu... selamat. Namamu tercantum di berkas itu. Kau adalah anak yang selamat. Pelaku kebakaran tidak pernah tertangkap.",
    choices: [
      { label: "Cari tahu siapa yang menyelamatkanmu.", next: "day4_penyelamat", effects: { evidence: 1 } },
      { label: "Cari tahu siapa pelaku kebakaran.", next: "day4_pelaku", effects: { evidence: 1 } }
    ]
  },

  day4_penyelamat: {
    day: 4, speaker: "NARASI",
    portrait: "img/17_berkas_lama.jpg",
    text: "Di halaman terakhir: \"Anak selamat ditemukan oleh petugas magang bernama E. Voss. Ia membawa anak itu keluar dari gedung yang terbakar. E. Voss menolak penghargaan. Ia hanya meminta satu hal: agar anak itu tidak pernah dihubungi lagi.\"",
    choices: [
      { label: "Konfrontasi Elara sekarang juga.", next: "day5_konfrontasi", effects: { trustElara: -1, evidence: 1 } },
      { label: "Simpan dulu. Kumpulkan bukti lebih banyak.", next: "day5_lanjut", effects: { evidence: 1 } }
    ]
  },

  day4_pelaku: {
    day: 4, speaker: "NARASI",
    portrait: "img/18_berkas_kebakaran.jpg",
    text: "Berkas itu menyebut tiga nama pendiri kantor polisi — termasuk Kapten Harrow muda. Mereka dituduh membakar gedung untuk menutupi korupsi. Tapi tuduhan itu tidak pernah terbukti. Salah satu saksi kunci hilang. Namanya: E. Voss.",
    choices: [
      { label: "Tanya Elara tentang kebakaran.", next: "day5_konfrontasi", effects: { trustElara: -2, evidence: 1 } },
      { label: "Simpan. Selidiki lebih dalam.", next: "day5_lanjut", effects: { evidence: 1 } }
    ]
  },

  // ===================== DAY 5 =====================
  day5_konfrontasi: {
    day: 5, speaker: "SERGEANT ELARA VOSS",
    portrait: "img/19_elara_ambang_pintu.jpg",
    text: "Elara menatapmu dari ambang pintu. \"Kau menemukannya.\" Ia tidak terlihat marah. Hanya lelah. \"Aku menyelamatkanmu sepuluh tahun lalu. Tapi ada hal lain yang belum kau tahu. Berhenti sekarang. Sebelum kau menemukan sesuatu yang tidak bisa kau tanggung.\"",
    choices: [
      { label: "\"Aku tidak akan berhenti. Aku akan menyelesaikan ini.\"", next: "day6_cctv", effects: { trustElara: -1, evidence: 1 } },
      { label: "\"Kau benar. Aku berhenti. Aku pergi dari kota ini.\"", next: "ending2_start" },
      { label: "\"Kalau begitu ceritakan semuanya. Sekarang.\"", next: "day5_cerita", effects: { trustElara: 1 } }
    ]
  },

  day5_lanjut: {
    day: 5, speaker: "NARASI",
    portrait: "img/20_kota_sesak.jpg",
    text: "Kau memutuskan untuk tidak konfrontasi dulu. Bukti masih kurang. Tapi kota ini mulai terasa sesak. Setiap sudut mengawasimu. Setiap langkah terasa diawasi. Beban di dadamu makin berat.",
    choices: [
      { label: "Lanjut selidiki. Cek CCTV pelabuhan.", next: "day6_cctv", effects: { stress: 1 } },
      { label: "Aku tidak sanggup. Aku pulang ke kota asal.", next: "ending2_start" }
    ]
  },

  day5_cerita: {
    day: 5, speaker: "SERGEANT ELARA VOSS",
    portrait: "img/21_elara_duduk_rapuh.jpg",
    text: "Elara duduk. Untuk pertama kalinya, ia terlihat rapuh. \"Sepuluh tahun lalu, Kapten dan dua pendiri lain membakar gedung ini untuk menutupi korupsi. Dua temanmu mati. Aku menyelamatkanmu. Tapi aku juga... membunuh mereka yang membakar. Satu per satu. Perlahan. Dan aku belum selesai.\"",
    choices: [
      { label: "\"Kau pembunuh.\"", next: "day6_cctv", effects: { trustElara: -2, evidence: 1 } },
      { label: "\"Aku mengerti. Tapi ini harus berhenti.\"", next: "day6_cctv", effects: { trustElara: 1, evidence: 1 } }
    ]
  },

  // ===================== ENDING 2 =====================
  ending2_start: {
    day: 5, speaker: "NARASI",
    portrait: "img/e2_peron_kereta.jpg",
    text: "Kau mengemas barangmu. Surat pengunduran diri di meja Kapten. Kereta pukul enam pagi. Elara berdiri di peron, jauh, tidak mendekat. Kau tidak melambaikan tangan. Kau tidak menoleh.\n\nKota Virendell menghilang di balik jendela kereta. Kau pikir kau bebas. Tapi kau tidak pernah benar-benar pergi. Setiap malam kau memimpikan lingkaran arang. Setiap malam kau bertanya-tanya: apa yang terjadi setelah kau pergi?",
    onEnter: () => { state.stress = 6; },

    text: "Kau menurunkan pistol. Kau menarik napas. Kau memutuskan untuk bertahan. Tapi kau tahu, kau tidak bisa selamanya.",
    choices: [{ label: "Lanjut ke hari terakhir.", next: "day14_final" }]
  },

  day14_final: {
    day: 14, speaker: "NARASI",
    portrait: "img/53_berkas_baru.jpg",
    text: "Hari ke-14. Kau duduk di kantor. Kapten Harrow masuk. \"Kau terlihat buruk.\" Ia meletakkan berkas baru di meja. \"Kasus baru. Korban keempat.\" Kau menatap berkas itu. Kau tidak sanggup membukanya.",
    choices: [
      { label: "Buka berkas. Lanjutkan.", next: "ending5_start", effects: { stress: 2 } },
      { label: "Tidak. Aku sudah selesai.", next: "ending7_final" }
    ]
  },

  // ===================== ENDING 7 =====================
  ending7_final: {
    day: 12, ending: "ENDING 7 — BEBAN YANG TERLALU BERAT",
    portrait: "img/e7_meja_catatan.jpg",
    text: "Kau mengakhiri hidupmu di hari ke-12. Di meja, catatan terakhir: \"Maaf. Aku tidak cukup kuat.\" Kasus tidak pernah selesai. Elara tidak pernah tertangkap. Dan kota Virendell... tetap hidup dengan rahasianya sendiri.\n\n— TAMAT —",
    choices: []
  },

  // ===================== ENDING 8 =====================
  ending8_final: {
    day: 0, ending: "ENDING 8 — YOU NOT PLAYING BRO",
    portrait: "img/e8_layar_kosong.jpg",
    text: "Kau tidak bergerak. Kau tidak memilih. Kau membiarkan waktu berlalu, dan kota Virendell... menunggu. Tapi kau tidak pernah datang. Kasus tidak pernah selesai. Pembunuh terus membunuh. Dan kau hanya duduk di sana, menatap layar, tidak melakukan apa-apa.\n\nKota ini butuh detektif. Bukan penonton.\n\n— TAMAT —",
    choices: []
  }
};

// ============================================================
// MESIN GAME
// ============================================================
const els = {
  text: document.getElementById("text"),
  choices: document.getElementById("choices"),
  speaker: document.getElementById("speaker"),
  scene: document.getElementById("scene"),
  dayLabel: document.getElementById("dayLabel"),
  stressLabel: document.getElementById("stressLabel"),
  stressFill: document.getElementById("stressFill"),
  overlay: document.getElementById("overlay"),
  why: document.getElementById("why")
};

let lastInteraction = Date.now();
let idleStage = 0;
let idleTimer = null;

const STRESS_NOTES = {
  5: "Kepalamu berdenyut. Kau mulai sulit berkonsentrasi.",
  7: "Tanganmu gemetar. Setiap suara membuatmu tersentak.",
  9: "Kau merasa dunia menyempit. Kau ingin semuanya berhenti."
};

function applyEffects(effects) {
  if (!effects) return;
  if (effects.stress) state.stress = Math.min(10, state.stress + effects.stress);
  if (effects.evidence) state.evidence = Math.min(5, state.evidence + effects.evidence);
  if (effects.trustElara) state.trustElara += effects.trustElara;
  if (effects.day) state.day = Math.min(14, state.day + effects.day);
  if (effects.salahCctv) state.salahCctv = true;
}

function getStressNote() {
  if (state.stress >= 9) return STRESS_NOTES[9];
  if (state.stress >= 7) return STRESS_NOTES[7];
  if (state.stress >= 5) return STRESS_NOTES[5];
  return null;
}

function filterChoicesByStress(node, choices) {
  if (!choices) return [];
  if (state.stress >= 9) {
    return choices.filter(c => {
      if (c.next === "day13_bertahan") return false;
      if (c.label.includes("Bertahan")) return false;
      return true;
    });
  }
  return choices;
}

function updateHUD() {
  els.dayLabel.textContent = state.day > 0 ? state.day : "—";
  els.stressLabel.textContent = state.stress;
  const pct = (state.stress / 10) * 100;
  els.stressFill.style.width = pct + "%";
  let color = "#4a8a4a";
  if (state.stress >= 8) color = "#8a2a2a";
  else if (state.stress >= 5) color = "#8a7a2a";
  els.stressFill.style.background = color;
  if (state.stress >= 8) document.body.classList.add("stress-high");
  else document.body.classList.remove("stress-high");
}

function setSceneImage(url) {
  // Fade out
  els.scene.classList.add("fade-img");
  setTimeout(() => {
    if (url) {
      // Preload dulu, kalau gagal tampilkan placeholder
      const img = new Image();
      img.onload = () => {
        els.scene.style.backgroundImage = `url('${url}')`;
        els.scene.innerHTML = "";
        els.scene.classList.remove("fade-img");
      };
      img.onerror = () => {
        els.scene.style.backgroundImage = "";
        els.scene.innerHTML = `<div class="placeholder">Gambar tidak ditemukan<br><small>${url}</small></div>`;
        els.scene.classList.remove("fade-img");
      };
      img.src = url;
    } else {
      els.scene.style.backgroundImage = "";
      els.scene.innerHTML = `<div class="placeholder">Gambar Adegan<br><small>img/...</small></div>`;
      els.scene.classList.remove("fade-img");
    }
  }, 200);
}

function render(nodeKey) {
  const node = story[nodeKey];
  if (!node) return;
  state.current = nodeKey;

  if (node.day && node.day > state.day && !node.ending) {
    state.day = node.day;
  }

  if (typeof node.onEnter === "function") node.onEnter();

  els.text.classList.remove("fade");
  void els.text.offsetWidth;
  els.text.classList.add("fade");

  updateHUD();

  els.speaker.textContent = node.speaker || "NARASI";

  // Gambar full
  setSceneImage(node.portrait || "");

  let html = node.text.replace(/\n/g, "<br>");

  if (!node.ending) {
    const note = getStressNote();
    if (note) {
      html += `<span class="stress-note">${note}</span>`;
    }
  }

  if (node.ending) {
    els.text.innerHTML = `<div class="ending-title">${node.ending}</div>` + node.text.replace(/\n/g, "<br>");
  } else {
    els.text.innerHTML = html;
  }

  els.choices.innerHTML = "";
  const filteredChoices = filterChoicesByStress(node, node.choices);

  if (filteredChoices && filteredChoices.length > 0) {
    filteredChoices.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "choice";
      if (state.stress >= 7 && (c.label.includes("Akhiri") || c.label.includes("Tidak") || c.label.includes("Menyerah"))) {
        btn.classList.add("desperate");
      }
      btn.textContent = c.label;
      btn.onclick = () => {
        registerInteraction();
        applyEffects(c.effects);
        render(c.next);
      };
      els.choices.appendChild(btn);
    });
  } else {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = "↻ Main Lagi";
    btn.onclick = resetGame;
    els.choices.appendChild(btn);
  }

  resetIdle();
}

// ============================================================
// SISTEM IDLE
// ============================================================
function registerInteraction() {
  lastInteraction = Date.now();
  if (idleStage === 1) {
    hideWhy();
    resetIdle();
  }
}

function resetIdle() {
  idleStage = 0;
  hideWhy();
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    showWhy();
  }, 180000);
}

function showWhy() {
  idleStage = 1;
  els.overlay.classList.add("active");
  document.body.classList.add("creepy");
  idleTimer = setTimeout(() => {
    if (idleStage === 1) {
      idleStage = 2;
      els.overlay.classList.remove("active");
      document.body.classList.remove("creepy");
      render("ending8_final");
    }
  }, 120000);
}

function hideWhy() {
  els.overlay.classList.remove("active");
  document.body.classList.remove("creepy");
}

document.addEventListener("mousemove", registerInteraction);
document.addEventListener("keydown", registerInteraction);
document.addEventListener("click", registerInteraction);

// ============================================================
// RESET
// ============================================================
function resetGame() {
  state.day = 1;
  state.stress = 0;
  state.evidence = 0;
  state.trustElara = 0;
  state.current = "start";
  state.salahCctv = false;
  registerInteraction();
  render("start");
}

render("start");
</script>
</body>
</html>
